<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan video Promer AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* 3 tầng: trang đầu (2 loại video) → danh sách → chi tiết + nút storyboard. Màu theo web promer.ai. */
:root{
  --bg:#E8E9EE; --card:#FFFFFF; --ink:#1B2034; --ink-2:#4A4F60; --ink-3:#7A7F8E; --line:#DEE1F3;
  --violet:#5B4BF0; --pink:#EC4899; --grad:linear-gradient(97deg,#5B4BF0 0%,#A63BE8 46%,#EC4899 100%);
  --done:#16A36B; --done-bg:#E4F6EE; --doing:#2F6BFF; --doing-bg:#E6EEFF; --wait:#B4520E; --wait-bg:#FEF1DA; --idle-bg:#F0F0F2;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1080px;margin:0 auto}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--violet);font-weight:600;font-size:14px;margin-bottom:16px}
.back:focus-visible,.tile:focus-visible,.vcard:focus-visible,.btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
/* trang đầu */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:28px}
.tile{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(26,26,26,.08);transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile .art{position:relative;height:300px;display:flex;gap:10px;align-items:center;justify-content:center;background:#1B2034;overflow:hidden}
.tile .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(27,32,52,.65))}
.tile .art img{height:84%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tile .art img:nth-child(2){height:92%;z-index:1}
.tile.long .art{background:var(--grad)}
.tile .wide-mock{width:78%;aspect-ratio:16/9;border-radius:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:.02em}
.tile .art img.wide{height:auto;width:86%;aspect-ratio:16/9;object-fit:cover;object-position:left top;border-radius:12px}
.tile .txt{padding:18px 20px 20px;display:flex;flex-direction:column;gap:4px}
.tile .txt b{font-size:22px}
.tile .txt span{color:var(--ink-2);font-size:14px}
.tile .count{font-weight:700;color:var(--violet)}
/* danh sách */
.group{margin-top:28px}
.group h3{font-size:17px;font-weight:700;margin-bottom:4px}
.group p{margin:0 0 14px;color:var(--ink-3);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.grid.long{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.vcard{display:flex;flex-direction:column;text-decoration:none;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(26,26,26,.06);min-width:0;transition:transform .2s}
.vcard:hover{transform:translateY(-2px)}
.vcard .th{aspect-ratio:9/12;background:#1B2034 center/cover no-repeat;position:relative}
.grid.long .vcard .th{aspect-ratio:16/9}
.vcard .th.empty{background:var(--grad);display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;color:#fff;font-size:13px;font-weight:600}
.vcard .num{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:20px}
.vcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vcard .nm{font-weight:700;font-size:15.5px;line-height:1.3}
.vcard .sm{color:var(--ink-2);font-size:13.5px}
.pill{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--idle-bg);color:var(--ink-2)}
.pill.done{background:var(--done-bg);color:var(--done)}
.pill.doing{background:var(--doing-bg);color:var(--doing)}
.pill.wait{background:var(--wait-bg);color:var(--wait)}
/* chi tiết */
.detail{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:28px;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(26,26,26,.08)}
.detail .big{width:100%;border-radius:16px;aspect-ratio:9/12;background:#1B2034 center/cover no-repeat}
.detail.long .big{aspect-ratio:16/9}
.detail .big.empty{background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center;font-weight:600}
.detail .info{display:flex;flex-direction:column;gap:14px;min-width:0}
.detail .lead{font-size:17px;color:var(--ink);margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:14px;background:#1B2034;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #A63BE8}
.btn.off{background:var(--idle-bg);color:var(--ink-3);box-shadow:none;cursor:default}
.minor{display:flex;flex-wrap:wrap;gap:8px}
.minor a{font-size:13px;color:var(--violet);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px;margin:0;font-size:14.5px;border-top:1px solid var(--line);padding-top:14px}
dt{color:var(--ink-3);font-weight:600;font-size:13px}
dd{margin:0;color:var(--ink-2)}
dd b{color:var(--ink)}
.en{color:var(--ink);font-weight:600}
.vi{color:var(--ink-3);font-size:13.5px}
.hash{font-size:13px;color:var(--violet)}
.why{background:#F6F5FB;border-radius:14px;padding:12px 16px}
.why h4{margin:0 0 6px;font-size:13px;color:var(--ink-3)}
.why ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.btn.ghost{background:#fff;color:#1B2034;box-shadow:0 0 0 1px var(--line)}
.sched{margin-top:40px}
.slist{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.srow{display:grid;grid-template-columns:64px 54px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:10px 16px 10px 12px;text-decoration:none;box-shadow:0 4px 14px rgba(26,26,26,.05)}
.srow:hover{box-shadow:0 0 0 2px #A63BE8}
.srow:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.sday{display:flex;flex-direction:column;font-size:13px;color:var(--ink-3);line-height:1.3}
.sday b{font-size:18px;color:var(--ink)}
.srow img{width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:8px}
.sinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.sinfo b{font-size:15px}
.sinfo span{font-size:13.5px;color:var(--ink-2)}
@media (max-width:560px){.srow{grid-template-columns:52px 44px minmax(0,1fr)}.srow .pill{display:none}.srow img{width:44px}}
.more{overflow-wrap:anywhere;margin-top:20px;background:var(--card);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(26,26,26,.06);display:flex;flex-direction:column;gap:12px;min-width:0}
.more h2{font-size:clamp(19px,2.4vw,24px)}
.more h3{font-size:17px;margin-top:8px}
.more .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.more .lede,.more p{color:var(--ink-2);margin:0}
.more .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 2px 8px rgba(26,26,26,.04);margin:14px 0}
.more table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.more th,.more td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.more th{background:var(--bg-2);color:var(--ink);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.more tr:last-child td{border-bottom:none}
.more tr:nth-child(even) td{background:rgba(0,0,0,.015)}
.more tr:hover td{background:rgba(135,62,255,.03)}
.more ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.more a{color:var(--violet)}
footer{margin-top:36px;font-size:13px;color:var(--ink-3)}
footer a{color:var(--violet)}
@media (max-width:700px){
  .detail{grid-template-columns:1fr}
  .detail .big{max-width:280px}
  dl{grid-template-columns:1fr;gap:2px}
  dt{padding-top:8px}
  .tile .art{height:230px}
}
@media (prefers-reduced-motion:reduce){.tile,.vcard{transition:none}}
</style>
</head>

>\n      <li>Ảnh túi cà phê chụp điện thoại in trên trang báo bỗng <b>cử động<\/b>: ảnh tĩnh thành video ngay trong giây đầu.<\/li>\n      <li>Lật trang báo, mỗi trang là <b>một việc<\/b> của quảng cáo Black Friday: <b>Deal<\/b> (cho thấy giá giảm) · <b>Deadline<\/b> (cho thấy ngày hết) · <b>Bundle<\/b> (cho thấy mua nhiều hơn). Mỗi trang là một video Promer thật làm từ cùng tấm ảnh đó.<\/li>\n      <li>Mặt sau tờ báo là ô rao vặt: màn kết quả Promer AI Ad Animation, rồi mục \"Reader poll\" hỏi người xem chạy bản nào trước.<\/li>\n    <\/ul>\n\n    <h2 style=\"margin-top:18px\">Người xem được gì<\/h2>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Câu hỏi<\/th><th>Trả lời<\/th><th>Mức<\/th><\/tr>\n      <tr><td>Vì sao họ dừng lại?<\/td><td>Khung đầu là trang nhất báo với tít đúng nỗi lo tháng 11 của chủ shop. Ở giây 1,5 ảnh trên báo cử động, nên họ thấy trước/sau trước khi kịp lướt.<\/td><td>Khá. Tít báo nhiều chữ: chữ tít phải to (cao ≥ 90 px trên khung 1080), chỉ 5 chữ đọc được.<\/td><\/tr>\n      <tr><td>Họ mang về được gì?<\/td><td>Một cách chia việc dùng ngay, kể cả không dùng Promer: quảng cáo Black Friday làm <b>3 bản cho 3 việc<\/b> (giá · hạn chót · combo) từ cùng một ảnh, rồi để tài khoản quảng cáo chọn bản thắng.<\/td><td>Khá. Là lời khuyên cách làm, không phải số liệu, nên không cần dẫn nguồn.<\/td><\/tr>\n      <tr><td>Xem xong họ làm gì khác?<\/td><td>Lấy ảnh sản phẩm bán chạy nhất, chọn việc cho bản đầu tiên, bình luận 1, 2 hoặc 3. Related video dẫn sang video dài Black Friday (L2).<\/td><td>Trung bình. L2 chưa làm, tạm để Related video trỏ về video kênh gần nhất.<\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 style=\"margin-top:18px\">Các cảnh (khoảng 25 giây, giọng Emma, phụ đề cứng)<\/h2>\n    <p class=\"lede\" style=\"margin-bottom:8px\">Lời đọc 48 chữ, khoảng 14–18 giây theo tốc độ Emma (2,6–3,4 chữ/giây). Chữ trên tờ báo tránh ô phụ đề (y 1365–1440).<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Cảnh<\/th><th>Giây<\/th><th>Hình<\/th><th>Lời đọc<\/th><\/tr>\n      <tr><td><b>SC01_Hook<\/b><\/td><td>0–3<\/td><td>Tờ báo xoay vào khung kiểu phim cũ, dừng ở 0,6 giây. Măng-sét \"THE SELLER TIMES\", tít \"BLACK FRIDAY: YOUR ADS AREN'T READY\", chữ nhỏ \"For Shopify sellers\". Ảnh túi cà phê chụp điện thoại in trên báo; giây 1,5 ảnh bắt đầu cử động (video Promer).<\/td><td><span class=\"en\">\"Shopify sellers, Black Friday ads not ready?\"<\/span><br><span class=\"vi\">Merchant Shopify, quảng cáo Black Friday chưa xong?<\/span><\/td><\/tr>\n      <tr><td><b>SC02_Clipping<\/b><\/td><td>3–6<\/td><td>Máy đẩy vào khung ảnh trên báo. Góc trang ghim mẩu ảnh gốc chụp điện thoại, chú thích \"the only photo\".<\/td><td><span class=\"en\">\"Skip the reshoot. Give one photo three jobs.\"<\/span><br><span class=\"vi\">Khỏi chụp lại. Giao cho một tấm ảnh ba việc.<\/span><\/td><\/tr>\n      <tr><td><b>SC03_Deal<\/b><\/td><td>6–10<\/td><td>Lật trang, đầu trang \"PAGE 2 · THE DEAL\". Video Promer bản 1: hạt cà phê bung quanh túi, nhịp mạnh đúng drop nhạc; chữ giá giảm do AE dựng trên trang báo, không nằm trong video.<\/td><td><span class=\"en\">\"Job one: sell the deal.\"<\/span><br><span class=\"vi\">Việc một: bán cái giá.<\/span><\/td><\/tr>\n      <tr><td><b>SC04_Deadline<\/b><\/td><td>10–14<\/td><td>Lật trang, \"PAGE 3 · THE DEADLINE\". Video bản 2: phòng tối, một đèn spot rọi túi, hơi nóng bốc lên; AE thêm \"ENDS MONDAY\" kiểu tít báo.<\/td><td><span class=\"en\">\"Job two: sell the deadline.\"<\/span><br><span class=\"vi\">Việc hai: bán hạn chót.<\/span><\/td><\/tr>\n      <tr><td><b>SC05_Bundle<\/b><\/td><td>14–18<\/td><td>Lật trang, \"PAGE 4 · THE BUNDLE\". Video bản 3: ba túi lần lượt rơi xuống xếp hàng.<\/td><td><span class=\"en\">\"Job three: sell the bundle.\"<\/span><br><span class=\"vi\">Việc ba: bán combo.<\/span><\/td><\/tr>\n      <tr><td><b>SC06_Classifieds<\/b><\/td><td>18–21<\/td><td>Tờ báo gập lại. Mặt sau có ô rao vặt: màn kết quả Promer AI Ad Animation dựng lại trong AE (ảnh túi vào, 3 video ra), dòng \"Made in Promer AI · Ad Animation\".<\/td><td><span class=\"en\">\"All three made in Promer AI from that one photo.\"<\/span><br><span class=\"vi\">Cả ba làm trong Promer AI từ đúng tấm ảnh đó.<\/span><\/td><\/tr>\n      <tr><td><b>SC07_Outro<\/b><\/td><td>21–25<\/td><td>Mục \"READER POLL\" trên mặt sau: 3 ảnh nhỏ đánh số 1, 2, 3, câu hỏi, logo Promer AI.<\/td><td><span class=\"en\">\"Which one runs first? Comment 1, 2, or 3.\"<\/span><br><span class=\"vi\">Bản nào chạy trước? Bình luận 1, 2 hoặc 3.<\/span><\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 style=\"margin-top:18px\">Nguồn ý tưởng<\/h2>\n    <ul class=\"ask\">\n      <li><b>Pin \"The Scent Times · don't gatekeep your perfume\"<\/b> (Pinterest, từ khoá \"perfume ad creative\", xem ngày 29/10/2026; ảnh lưới `02_Reference/pinterest_29-10/s03_perfume_pinterest.jpg`). Trong pin: một người cầm tờ báo che mặt, trang báo in chai nước hoa, ly cà phê trên bàn.<\/li>\n      <li><b>Lấy:<\/b> format tờ báo làm khung quảng cáo, tít giật một dòng.<\/li>\n      <li><b>Đổi:<\/b> không có người cầm báo (báo tự xoay vào khung); tít thành nỗi lo mùa sale của chủ shop; ảnh in trên báo cử động thành video Promer; lật trang để sang bản tiếp; mặt sau thành ô rao vặt và mục bình chọn.<\/li>\n    <\/ul>\n\n    <h2 style=\"margin-top:18px\">Đối chiếu trùng (6 ô)<\/h2>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Ô<\/th><th>Shorts 03<\/th><th>Gần nhất đã có<\/th><th>Kết luận<\/th><\/tr>\n      <tr><td>Lời hứa chính<\/td><td>Quảng cáo Black Friday có 3 việc: giá, hạn chót, combo<\/td><td>Shorts 02 \"một ảnh, ba quảng cáo\"; Short kênh \"10 Ads, Same Idea? Find New Ad Angles\"<\/td><td>Khác: 03 nói loại ưu đãi mùa sale, không nói góc sáng tạo hay tính năng Ad Concept. Gần nhất là Short kênh, cần anh xem.<\/td><\/tr>\n      <tr><td>Sản phẩm demo<\/td><td>Túi cà phê nhãn Promer<\/td><td>Chưa video nào dùng cà phê<\/td><td>Không trùng<\/td><\/tr>\n      <tr><td>Hình mở, kiểu mở<\/td><td>Trang nhất tờ báo, hỏi nỗi lo yện sản phẩm<\/b> (không phải khoe đầu ra Promer)"],["Tiêu đề","<span class=\"en\">The Ring Waited in a Pocket for Months<\/span>"],["Vấn đề shop","Đồ nhỏ, khó chụp, ảnh trên khay nhung trông rẻ."],["Số shop Shopify","Cả nhóm phụ kiện: <b>197.961<\/b> shop (chưa có số riêng trang sức)"],["Người xem tìm gì","Cách quảng cáo trang sức, đồ nhỏ khó chụp<br><span class=\"vi\">Gõ trên YouTube: \"jewelry advertising ideas\" · \"ads for jewelry\"<\/span>"],["Hashtag","<span class=\"hash\">#shopify #jewelryads #jewelrymarketing #aiads #shorts #ecommerce #dropshipping<\/span>"]],"btns":[],"more":["<h2>Câu chuyện: Chiếc nhẫn trong túi áo (câu chuyện của một chiếc nhẫn cưới)<\/h2>\n<p><b>Chuyên mục:<\/b> Câu chuyện sản phẩm (kể chuyện một chiếc nhẫn cưới, tiết chế kiểu Cartier; Promer chỉ xuất hiện nhẹ ở cuối).<\/p>\n<p><b>Tiêu đề:<\/b> <span class=\"en\">The Ring Waited in a Pocket for Months<\/span><br><span class=\"vi\">Dự phòng: \"Thirty Years Later, Still the Same Ring\" · \"Nobody Buys a Ring. They Keep One.\"<\/span><\/p>\n<p><b>Chủ shop mang về được gì:<\/b> Bán nhẫn bằng khoảnh khắc đời của nó (chờ, trao, đeo, già đi cùng nhau), không bằng thông số hay lời khoe. Shop của bạn cũng làm được: cho khách thấy sản phẩm ở lúc người ta CHỜ nó và lúc người ta GIỮ nó nhiều năm, không chỉ lúc nó nằm trên nền trắng.<\/p>\n<p><b>Bản 1 · Kem ấm, lụa, máy tĩnh:<\/b> Tông kem và vàng nhạt, vải lụa, ánh sáng cửa sổ mềm. Máy gần như đứng yên, cắt mềm bằng chồng mờ chậm. Cảm giác: êm, thân mật, hoài niệm.<br><b>Bản 2 · Tối tương phản, macro, ánh sáng cứng:<\/b> Nền đen và đỏ rượu, một luồng sáng cứng chiếu chéo, cận macro. Máy trôi chậm, chuyển cảnh theo chuyển động của tay (tay che khung, tay đi ngang rồi lộ cảnh sau). Cảm giác: trang trọng, kiểu quảng cáo Cartier.<\/p>","<h2>Storyboard: Bản 1 và Bản 2, cùng câu chuyện<\/h2>\n<p style=\"font-size:.85em;color:#717582;margin:0 0 8px\">Hàng trên là câu chuyện từng cảnh (chung cho 2 bản). Hàng giữa là Bản 1, hàng dưới là Bản 2: khác cách quay, cùng lời. Anh chọn cảnh nào của bản nào để ghép cũng được. Ảnh là tham chiếu Pinterest, bấm để mở nguồn. Trên điện thoại kéo ngang.<\/p>\n<div style=\"overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px\"><div style=\"display:grid;grid-template-columns:52px repeat(6, minmax(150px, 1fr));gap:10px;align-items:stretch;min-width:1012px\"><div style=\"background:#f1f2f5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:.8em;padding:6px\">Cảnh<\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC01<\/b> · 0 đến 3 giây<br><b>Chữ:<\/b> <span class=\"en\">Before the yes.<\/span><br><span style=\"color:#717582\">Không lời<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC02<\/b> · 3 đến 8 giây<br><b>Chữ:<\/b> <span class=\"en\">Carried for months.<\/span><br><b>Lời:<\/b> <span class=\"en\">Carried for months.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC03<\/b> · 8 đến 13 giây<br><b>Chữ:<\/b> <span class=\"en\">Then, one second.<\/span><br><span style=\"color:#717582\">Không lời<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC04<\/b> · 13 đến 18 giây<br><b>Chữ:<\/b> <span class=\"en\">Yes.<\/span><br><span style=\"color:#717582\">Không lời<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC05<\/b> · 18 đến 24 giây<br><b>Chữ:<\/b> <span class=\"en\">Thirty years later.<\/span><br><b>Lời:<\/b> <span class=\"en\">Still the same ring.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC06<\/b> · 24 đến 28 giây<br><b>Chữ:<\/b> <span class=\"en\">Every ring has a story.<\/span><br><b>Lời:<\/b> <span class=\"en\">Every ring has a story. Tell yours.<\/span><\/div><div style=\"background:#f7efe4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:.8em;padding:6px\">Bản 1<\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=jewelry%20ad%20minimal%20cream%20silk%20hands\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/s07c/SC01_1a.jpg\" alt=\"Ảnh tham chiếu Pinterest\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=jewelry%20ad%20minimal%20cream%20silk%20hands\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/s07c/SC01_1b.jpg\" alt=\"Ảnh tham chiếu Pinterest\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Bàn tay trái đặt ngửa trên tấm lụa kem, ngón áp út trống, ánh sáng cửa sổ trượt chậm qua da. Máy đứng yên, hơi thở của ánh sáng là chuyển động duy nhất.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=hand%20in%20coat%20pocket%20ring%20box\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/s07c/SC02_1a.jpg\" alt=\"Ảnh tham chiếu Pinterest\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=hand%20in%20coat%20pocket%20ring%20box\" t g sinh","45–60 giây"],"why":["Chủ shop có ảnh sản phẩm nhưng chưa làm được video. Hook trong 5 giây đầu: một ảnh tĩnh nổ ra 3 video người thật cầm sản phẩm."],"dl":[["Sản phẩm","Chân cây thông cá nhân hoá, 1–10 tên (pawesomehouse.com, 29,99 USD; xoá logo shop khi làm video)"],["Câu mở","<span class=\"en\">\"One photo of this tree skirt. Three UGC ads. Zero filming.\"<\/span>"],["3 video UGC","Gốc cây trơ chân đế thành đẹp · cả nhà đọc tên mình · bà mở quà thấy tên các cháu"],["Rủi ro","AI hay làm méo chữ: cận cảnh tên ghép trong After Effects từ ảnh sản phẩm thật"],["Khung hình","16:9 (1920×1080)"],["Chỉ số theo dõi","Xem hết 5 giây đầu → CTR → đăng ký → trả phí"]],"btns":[{"href":"storyboard-xmas-ugc-1_Claude.html","text":"Xem storyboard","main":true}],"sum":"(16:9) Chân cây thông in tên cả nhà: một ảnh sản phẩm ra 3 video UGC, ba lý do mua (gốc cây đẹp, tên cả nhà, quà cho mẹ), rồi cho xem Promer làm thế nào.","more":["<div class=\"eyebrow\">Quảng cáo Giáng sinh 1 · chân cây thông · chờ duyệt<\/div><h2 class=\"big\">Các cảnh (hai bản A và B)<\/h2><div class=\"table-wrap\"><table><tr><th>Cảnh<\/th><th>Giây<\/th><th>Bản A<\/th><th>Bản B<\/th><\/tr><tr><td>SC01 Hook: kết quả trước<\/td><td>0–5<\/td><td>Ảnh sản phẩm của shop nằm giữa khung, vỡ thành 3 dải dọc 640×1080 (ba dải kín khung 16:9). Dải 1: gốc cây trơ chân đế. Dải 2: cả nhà quanh cây buổi tối. Dải 3: bà mở hộp quà. Giây 1–2 đã thấy 3 video chạy.<\/td><td>Bàn làm việc nhìn từ trên xuống: tay đặt ảnh chân cây lên bàn, 3 tờ giấy rơi ra, mỗi tờ lật thành một video.<\/td><\/tr><tr><td>SC02 3 UGC, 3 lý do mua<\/td><td>5–15<\/td><td>Mỗi video khoảng 3 giây, mỗi video một lý do mua. (1) Gốc cây xấu thành đẹp: máy cúi xuống chân đế sắt, creator nói \"Our tree looked like this for years.\", trải thảm, vuốt phẳng, máy lùi ra thấy cây hoàn chỉnh. (2) Đọc tên cả nhà: mẹ ngồi bệt trên sàn chỉ từng người tuyết \"That's me, that's Daniel...\", bé chạy vào chỉ tên mình. (3) Mở quà: bà mở hộp, đọc thấy tên các cháu, đưa tay lên ngực. Tên trên thảm cận cảnh ghép trong AE từ ảnh sản phẩm thật, không để AI vẽ chữ.<\/td><td>Cùng 3 lý do, nhưng quay kiểu selfie nói vào camera: mỗi creator cầm mép thảm đưa sát máy cho thấy tên, nói một câu. Ba người xếp thành 3 dải dọc kín khung 16:9, sáng lần lượt theo nhịp.<\/td><\/tr><tr><td>SC03 Cách làm, đa dạng<\/td><td>15–35<\/td><td>UI Promer phủ kín khung 16:9, nền ấm. 15–20 dán link chân cây. 20–26 Promer đọc quảng cáo đang thắng và gợi ý hook (quà tặng, cả nhà, gốc cây đẹp). 26–32 thư viện 5.000 avatar: lọc tuổi để có cả mẹ trẻ lẫn bà (nhấn sự đa dạng). 32–35 bấm tạo.<\/td><td>Cùng 4 nhịp, nhưng UI nằm trên laptop đặt trên bàn, máy đẩy vào dần. Ở nhịp avatar, con trỏ chọn lần lượt 3 người khác độ tuổi.<\/td><\/tr><tr><td>SC04 Spy và Clone<\/td><td>35–46<\/td><td>Quảng cáo chân cây cá nhân hoá đang thắng trượt vào từ phải (che tên hãng), rồi biến thành bản của mình với đúng chân cây của mình.<\/td><td>Một tờ quảng cáo đối thủ được chép thành tờ mới: tờ cũ nằm dưới, tờ mới hiện lên với chân cây của mình.<\/td><\/tr><tr><td>SC05 CTA<\/td><td>46–52<\/td><td>Logo Promer và nút viền chạy màu (dùng lại kiểu CTA Shorts 01).<\/td><td>Giống bản A (CTA cố định theo sheet).<\/td><\/tr><\/table><\/div>"]},{"id":"xmas-ugc-2","kind":"short","group":"idea","img":"img/xmas-ugc/sb2/lat2.jpg","alt":"Ảnh tham chiếu Pinterest: ly latte in hình mặt cô gái","num":"12","name":"Quảng cáo Giáng sinh 2 · She's not real","stc":"wait","st":"Chờ anh duyệt storyboard bản 2 (03/11)","tags":["Quảng cáo chạy chuyển đổi","Giáng sinh","35 giây","16:9"],"why":["Brief marketing (video 4 trong mục \"They're/She's not real\"): một cô gái đẹp, da thật, dùng sản phẩm như người thật, rồi lật mặt cô ấy là AI.","Nghiên cứu YouTube 03/11: Short chỉ có hook \"She's not real\" phần lớn dưới 1.000 view; Short thắng (58K, 92K, 822K) có cảnh mở tự đứng được hoặc chia đôi sản phẩm | AI."],"dl":[["Sản phẩm","Máy in ảnh lên bọt cà phê (theo brief: kiểu Brew Shot), làm bản riêng không logo bằng GodTools"],["Câu mở","<span class=\"en\">\"Okay… I just printed my face on my latte.\"<\/span> rồi <span class=\"en\">\"The latte is real. She isn't.\"<\/span>"],["Cảnh","Kết quả trước · lật mặt · một cô gái 3 bối cảnh · cách làm trên Promer · Spy/Clone · CTA"],["Khác video 3","Video 3 là 3 gương mặt; video này giữ MỘT gương mặt xuyên suốt"],["Cần chốt","Bản A/B từng cảnh · dạng máy in · trùng chủ đề cà phê với Shorts 03 · 16:9 hay 9:16"]],"btns":[{"href":"storyboard-xmas-ugc-2-v2_Claude.html","text":"Xem storyboard","main":true}],"sum":"(16:9, 35 giây) Cô gái in mặt mình lên ly latte Giáng sinh, nói như người thật, giây 5 lật \"cô ấy không có thật\", rồi cùng gương mặt đó ở 3 bối cảnh, cách làm trên Promer, Spy/Clone, CTA.","more":["<div class=\"eyebrow\">Quảng cáo Giáng sinh 2 · bản 2 · 03/11/2026 · chờ duyệt<\/div><h2 class=\"big\">Các cảnh<\/h2><div class=\"table-wrap\"><table><tr><th>Cảnh<\/th><th>Giây<\/th><th>Lời<\/th><\/tr><tr><td>SC01 Kết quả trước<\/td><td>0–5<\/td><td>(cô gái) \"Okay… I just printed my face on my latte.\"<\/td><\/tr><tr><td>SC02 Lật mặt<\/td><td>5–9<\/td><td>\"The latte is real. She isn't.\"<\/td><\/tr><tr><td>SC03 Một cô gái, 3 bối cảnh<\/td><td>9–18<\/td><td>\"One product photo. One AI creator. Every scene you need. No camera.\"<\/td><\/tr><tr><td>SC04 Cách làm<\/td><td>18–27<\/td><td>\"Paste your product link. Promer studies the ads already winning in your niche, writes the hooks, and turns them into UGC videos.\"<\/td><\/tr><tr><td>SC05 Tính năng khác<\/td><td>27–31<\/td><td>\"Out of ideas? Spy on competitors' ads, or clone a proven one.\"<\/td><\/tr><tr><td>SC06 CTA<\/td><td>31–35<\/td><td>\"Make your first winning ad today. Plans from nine dollars a month.\"<\/td><\/tr><\/table><\/div>"]},{"id":"ad02-santa","kind":"short","group":"idea","img":"img/ad02r/cover_hook_cu.jpg","alt":"Khung hook của bản dựng cũ: trang sản phẩm ở trái, video UGC bật lên ở phải","num":"13","name":"Quảng cáo Giáng sinh · Hộp khăn giấy ông già Noel: một link ra video UGC (làm lại)","stc":"wait","st":"Làm lại 04/11 · 2 storyboard chờ anh chọn","tags":["Hộp khăn giấy Noel","Làm lại","2 bản storyboard"],"why":["Bản cũ: 60% màn hình trống ở 2 giây đầu, video UGC tới giây 2 mới hiện","Bản cũ: không có logo Promer trong 4,5 giây đầu","Bản cũ: hình hộp Noel nhỏ, con trỏ che tờ khăn giấy"],"dl":[["Bản 1","<b>Kết quả trước<\/b>"],["Bản 2","<b>Chia đôi từ giây 0<\/b>"],["Lời hook","<span class=\"en\">\"I pasted one link. Promer made this.\"<\/span>"],["Sản phẩm","Hộp khăn giấy ông già Noel, shop giả Jolly Nook"]],"btns":[],"more":["<h2>Ad02 khăn giấy ông già Noel: làm lại để nhìn là biết đây là Promer, một link ra quảng cáo<\/h2>\n<p><b>Vì sao làm lại:<\/b> bản dựng đầu bị anh chê (04/11): hình sản phẩm và câu mở đầu chưa cho người xem biết đây là hệ thống gì. Em đo trên bản cũ 3 lỗi: (1) giây 0 đến 2 chỉ có điện thoại nhỏ ở góc trái, 60% màn hình bên phải trống, video UGC tới khoảng giây 2 mới hiện; (2) trong 4,5 giây đầu không có logo hay tên Promer trên màn hình; (3) hộp khăn giấy Noel nhỏ (khoảng 400/1080 px) và con trỏ che đúng tờ khăn giấy nên nhìn như đồ chơi.<\/p>\n<p><b>Giữ nguyên:<\/b> concept đã duyệt (một link sản phẩm ra video UGC), sản phẩm hộp khăn giấy ông già Noel, shop giả Jolly Nook, dashboard \"More orders. More revenue.\" ở cuối, giọng Emma, không có chữ nào nhắc tên nền tảng bán hàng.<\/p>\n<p><b>Chủ shop mang về được gì:<\/b> Quảng cáo công cụ phải cho người xem thấy BA thứ trong 2 giây đầu: sản phẩm rõ (nhìn là biết hộp khăn giấy), kết quả (video UGC đang chạy) và tên công cụ (logo Promer). Bản cũ chỉ có điện thoại bé ở góc, nửa màn hình trống, không logo. Shop của bạn cũng vậy: đặt sản phẩm TO và kết quả cạnh nhau ngay khung đầu.<\/p>\n<p><b>Bản 1 · Kết quả trước:<\/b> Giây 0 là video UGC full màn hình; điện thoại chứa trang sản phẩm trượt vào góc, copy link; logo Promer + chữ 1 link → this hiện trước giây 1,5. SC02 đẩy máy vào UI Promer thật; SC03 bức tường lưới 12 ô; SC04 dashboard; SC05 CTA sáng. Cảm giác: bất ngờ trước, giải thích sau.<br><b>Bản 2 · Chia đôi từ giây 0:<\/b> Hai nửa đầy màn hình ngay khung đầu: trái sản phẩm phóng to, phải UGC; logo Promer ở đường giữa với đường chấm nối. SC02 thẻ sản phẩm rơi vào UI; SC03 coverflow từng clip; SC04 thông báo đơn hàng nảy lên; SC05 nền tối. Cảm giác: so sánh rõ, một link thành quảng cáo.<\/p>","<h2>Storyboard làm lại: Bản 1 và Bản 2, cùng 5 cảnh<\/h2>\n<p style=\"font-size:.85em;color:#717582;margin:0 0 8px\">Hàng trên là lời và chữ từng cảnh (chung cho 2 bản). Hàng giữa là Bản 1, hàng dưới là Bản 2: khác cách quay, cùng lời. Anh chọn cảnh nào của bản nào để ghép cũng được. Ảnh là tham chiếu (Pinterest hoặc giao diện Promer thật); ô trống là chưa tìm được ảnh khớp. Trên điện thoại kéo ngang.<\/p>\n<div style=\"overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px\"><div style=\"display:grid;grid-template-columns:52px repeat(5, minmax(150px, 1fr));gap:10px;align-items:stretch;min-width:852px\"><div style=\"background:#f1f2f5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:.8em;padding:6px\">Cảnh<\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC01<\/b> · 0 đến 3 giây<br><b>Chữ:<\/b> <span class=\"en\">1 link → this<\/span><br><b>Lời:<\/b> <span class=\"en\">I pasted one link. Promer made this.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC02<\/b> · 3 đến 7 giây<br><b>Chữ:<\/b> <span class=\"en\">Paste link → Generate<\/span><br><b>Lời:<\/b> <span class=\"en\">Paste your product link. That's it.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC03<\/b> · 7 đến 23 giây<br><b>Chữ:<\/b> <span class=\"en\">1/12 → 12/12, nhãn loại sản phẩm<\/span><br><b>Lời:<\/b> <span class=\"en\">Bags. Tea. Tech. Home decor. Any product, real-looking UGC ads. No filming. No models.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC04<\/b> · 23 đến 26,5 giây<br><b>Chữ:<\/b> <span class=\"en\">More orders. More revenue.<\/span><br><b>Lời:<\/b> <span class=\"en\">More orders. More revenue.<\/span><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><b>SC05<\/b> · 26,5 đến 31 giây<br><b>Chữ:<\/b> <span class=\"en\">Try for Free<\/span><br><b>Lời:<\/b> <span class=\"en\">Make your first winning ad today. Plans from nine dollars a month.<\/span><\/div><div style=\"background:#f7efe4;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:.8em;padding:6px\">Bản 1<\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=hand%20holding%20phone%20online%20store%20product%20page%20mockup\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC01_1b.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Khung đầu (giây 0): video UGC chạy FULL màn hình 9:16, người phụ nữ ở phòng tắm rút khăn giấy từ hộp Noel, mặt nhăn vì buồn cười, nhìn rõ hộp trong tay người. Giây 0,4: một điện thoại nhỏ trượt từ góc dưới phải vào, hiện trang sản phẩm Jolly Nook, ngón tay bôi đen link và copy. Giây 1,0: huy hiệu logo Promer (biểu tượng + chữ ngang) bật vào góc trên trái cùng chữ `1 link → this`. Điện thoại thu nhỏ rồi lùi ra khỏi khung. Chuyển động: UGC nảy 104% về 100% theo tiếng nhạc bùng; điện thoại trượt có ease, dừng 0,5 giây; huy hiệu pop 120% về 100%. Người xem thấy kết quả trước, cách làm sau.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><div style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC02_1a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/div><\/div><div style=\"margin-top:8px\">Toàn màn hình là UI Promer thật (ảnh dashboard UGC Ads: logo Promer ở góc trên sidebar, tiêu đề 'Turn product into video ads with UGC Ads'). Máy đẩy nhẹ vào ô '1 Product'; con trỏ bấm 'add product', ô dán link hiện ra, link jollynook.store dán vào (dùng khung UI thật làm nền, ô nhập vẽ cùng font Inter, nút màu đen kiểu Promer); bấm 'Generate'. Chữ `Paste link → Generate`. Chuyển động: đẩy máy 110%; con trỏ cong theo đường cong 0,5 giây; nút Generate lún 96% rồi phát sáng; viền chạy màu quanh nút (giống Short 01).<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=ugc%20video%20collage%20grid%20wall%20tiktok\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC03_1a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=ugc%20video%20collage%20grid%20wall%20tiktok\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC03_1b.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Bức tường lưới 3 cột x 4 hàng, 12 video UGC từ kho Promer thật (túi, trà, bàn phím, sofa, giày, đèn...) lần lượt bật vào đúng phách nhạc, mỗi ô nhãn loại sản phẩm; đếm 1/12 đến 12/12 ở góc. Mở: ô giữa là Santa UGC (cô gái cười); đóng: máy lùi ra, cả 12 ô cùng chạy, ô Santa sáng lên. Chuyển động: mỗi phách một ô pop 108% về 100%; ở ô 7 máy lùi ra; nhiều ô cùng lúc chạy nhẹ lên xuống 1% khác pha.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=ecommerce%20analytics%20dashboard%20revenue%20growth%20ui\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC04_1a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=ecommerce%20analytics%20dashboard%20revenue%20growth%20ui\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC04_1b.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Thẻ dashboard 'Analytics' (không logo ngoài, không chữ nền tảng bán hàng): Total sales và Orders đếm tăng, đường doanh số vẽ lên, huy hiệu xanh lá +212%. Số là ví dụ minh hoạ. Chuyển động: số đếm tăng 1 giây có ease ra; đường vẽ lên; huy hiệu pop khi số tới đỉnh. Máy đẩy 105%.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><div style=\"flex:1;font-size:.8em;color:#717582;border:1px dashed #cfd2dc;border-radius:10px;padding:18px 8px;text-align:center\">Chưa có ảnh tham chiếu khớp<\/div><\/div><div style=\"margin-top:8px\">Nền sáng giống Ad01 v8: nút CTA trắng có viền chạy màu, 5 sao 4.8/5, chữ 'Trusted by 150K+ ecommerce merchants'; logo Promer lớn ở trên nút. Giá nảy lên lúc 'nine dollars'. Chuyển động: viền chạy quanh nút; sao điền từng cái; bảng giá nảy 108% về 100%.<\/div><\/div><div style=\"background:#ecedf3;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;font-size:.8em;padding:6px\">Bản 2<\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=split%20screen%20vertical%20video%20two%20phones%20design\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC01_2a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Hai nửa đầy màn hình ngay khung đầu, đường giữa dọc 6 px. TRÁI: trang sản phẩm PHÓNG TO: hộp khăn giấy Noel to chiếm gần hết nửa trái, MỘT tờ khăn giấy đang rút ra khỏi khe, dưới có tên The Cheeky Santa Tissue Holder và giá. PHẢI: UGC cô gái cười đang chạy. Giây 0,3: logo Promer hiện tại đường giữa trong một viên tròn trắng, từ viên tròn kéo đường chấm chạy từ ảnh sản phẩm sang video (như link đang nối). Chữ `1 link → this` nằm ở đường giữa phía dưới viên logo. Chuyển động: đường chấm chạy 2 nhịp từ trái sang phải; bên phải video bật lên đúng lúc chấm tới (flash trắng 3 khung). Máy đứng yên, không zoom. Người xem thấy cả sản phẩm lẫn kết quả cùng lúc.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><div style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC02_2a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/div><\/div><div style=\"margin-top:8px\">Thẻ sản phẩm 'Jolly Nook' từ nửa trái của SC01 TRƯỢT sang phải rồi RƠI vào ô '1 Product' của giao diện Promer (ảnh màn 'Auto-generate scripts' có 4 ô sản phẩm, logo Promer trên sidebar); ô sản phẩm tự lấp đầy 4 góc nhìn hộp Noel; chữ gợi ý 'Suggested video idea' hiện; con trỏ bấm 'Generate script'. Cắt bớt sidebar để UI chiếm 2/3 màn hình, nền tím nhạt. Chuyển động: shared element thẻ sản phẩm (0,42 giây, vận tốc hai bên bằng nhau); ô sản phẩm bật 4 ảnh lần lượt cách nhau 0,12 giây; nút bấm có vòng sóng lan. Khác bản 1: không gõ link, sản phẩm tự bay vào.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><div style=\"flex:1;font-size:.8em;color:#717582;border:1px dashed #cfd2dc;border-radius:10px;padding:18px 8px;text-align:center\">Chưa có ảnh tham chiếu khớp<\/div><\/div><div style=\"margin-top:8px\">MỘT video UGC full màn hình tại mỗi lúc, cắt cứng theo phách (1,3 giây một clip), kiểu cuộn coverflow: clip giữa đang chạy, hai clip bên ló ra 8% mép và trượt trái mỗi phách. Mép phải có dải 12 chấm, chấm đang chiếu sáng; nhãn loại sản phẩm trượt lên từ đáy. Santa mở và đóng đoạn. Chuyển động: cắt cứng, mỗi cắt có whoosh ngắn; dải chấm chạy đều; không cắt kiểu lưới. Khác bản 1: tập trung từng clip, người xem nhìn rõ từng sản phẩm.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=new%20order%20notification%20toast%20mobile%20ui\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC04_2a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=ecommerce%20analytics%20dashboard%20revenue%20growth%20ui\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC04_2b.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Nền trang sản phẩm Jolly Nook mờ; thông báo đơn hàng mới nảy lên chồng nhau từ trên xuống ('New order · The Cheeky Santa Tissue Holder · $24.99') cứ 0,3 giây một cái, rồi cả chồng thu lại thành một số doanh thu lớn $58,420 đếm tăng ở giữa màn hình. Chữ `More orders. More revenue.`. Chuyển động: mỗi thông báo trượt xuống có nảy; tiếng ting mỗi đơn; số lớn đếm tăng 1 giây. Khác bản 1: người xem nghe và thấy từng đơn về, không chỉ nhìn bảng.<\/div><\/div><div style=\"border:1px solid #e3e4ea;border-radius:12px;padding:10px;background:#fff;font-size:.8em;line-height:1.45\"><div style=\"display:flex;gap:6px\"><a href=\"https://www.pinterest.com/search/pins/?q=dark%20minimal%20logo%20end%20screen%20glow\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC05_2a.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><a href=\"https://www.pinterest.com/search/pins/?q=dark%20minimal%20logo%20end%20screen%20glow\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 0;min-width:0\"><img src=\"img/ad02r/SC05_2b.jpg\" alt=\"Ảnh tham chiếu\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block\"><\/a><\/div><div style=\"margin-top:8px\">Nền tối, 12 ô UGC ghost mờ phía sau lưới, logo Promer to ở giữa phát sáng, nút `Try for Free` đen viền tím nhạt bên dưới; 5 sao hiện dưới nút. Cuối: lưới ghost sáng lên một lần rồi tắt. Chuyển động: logo lớn dần 90% đến 100% chậm, ánh sáng loang trôi; nút lên từ đáy; không viền chạy màu (khác Ad01 và khác bản 1).<\/div><\/div><\/div><\/div>","<h2>Cần anh quyết<\/h2><ul>\n<li>Chọn <b>Bản 1<\/b>, <b>Bản 2<\/b>, hoặc ghép cảnh (ví dụ SC01 Bản 1 + SC02 Bản 2). Anh chọn xong em sang bước Key visual: tạo lại hình hộp Noel cho nhìn là biết hộp khăn giấy.<\/li>\n<li>Ảnh tham chiếu: 8 ảnh yếu hoặc lạc đề đã được loại khỏi trang này (ô nào trống là chưa tìm được ảnh khớp). Em sẽ tìm lại nếu anh cần.<\/li>\n<li>Bản dựng cũ (file AE 26.x) giữ nguyên, chưa sửa và chưa xuất video.<\/li><\/ul>"],"sum":"Làm lại vì hook trống nửa màn hình, không thấy logo Promer và hình sản phẩm nhỏ. 2 hướng: Bản 1 cho xem video UGC trước, Bản 2 chia đôi màn hình từ giây 0."},{"id":"ad05-winning","kind":"short","group":"idea","img":"img/ad05/v3/K3.jpg","alt":"Khung GodTools: cô gái cầm đồ trang trí sứ in ảnh gia đình sát ống kính","num":"14","name":"Quảng cáo 05 · Bắt đầu từ quảng cáo đang thắng","stc":"wait","st":"Storyboard bản 3 theo video mẫu (04/11) · chờ anh duyệt","tags":["Quảng cáo chạy chuyển đổi","Giáng sinh","28 giây","16:9","Video Ad Clone","Theo video mẫu Creatify"],"why":["Brief marketing (sheet, video 5): \"You don't need a new idea, start from winning ad\". Nỗi đau: người mới bí ý tưởng làm quảng cáo.","Promer có tính năng thật cho đúng việc này: Video Ad Clone đọc câu mở, cảnh, nhịp của một video mẫu rồi kiểm sản phẩm có hợp không (\"Your product fits this video\")."],"dl":[["Sản phẩm","Đồ trang trí cây thông bằng sứ in ảnh gia đình (\"The Millers · Christmas 2026\"), shop giả không logo"],["Câu mở","<span class=\"en\">\"Stuck on your next Christmas ad?\"<\/span>"],["Cảnh","Lướt Reels · quảng cáo viral bật ra · đưa vào Promer · chia đôi gốc | của mình · Posted. Loved. · Orders today · cảnh đời thật · CTA"],["Video mẫu","Creatify \"Viral Reference In. Your Ad Out.\" · đi đúng mạch, hình làm lại bằng GodTools"],["Cần chốt","Giữ cảnh đếm đơn (Demo data) · 16:9 hay 9:16"]],"btns":[{"href":"storyboard-ad05-v3_Claude.html","text":"Xem storyboard","main":true}],"sum":"(16:9, 28 giây) Đi đúng mạch video mẫu: lướt Reels, quảng cáo Giáng sinh viral bật ra, đưa vào Promer Video Ad Clone, chia đôi bản gốc | bản đồ trang trí in ảnh của mình, đăng lên, đơn về, CTA.","more":["<h2>Quảng cáo 05 bản 3: đi đúng mạch video mẫu, hình làm lại bằng GodTools<\/h2>\n<p>Anh dặn 04/11: làm kiểu video mẫu Creatify, dùng GodTools làm hình xịn hơn, vì bản trước đi hơi xa. Bản 2 (quả châu phản chiếu, thẻ sưu tầm) dừng lại.<\/p>\n<p><b>Người xem mang về:<\/b> lấy một quảng cáo đang thắng, giữ câu mở, góc máy, nhịp, chỉ thay sản phẩm; cảnh chia đôi cho thấy rõ giữ gì, thay gì.<\/p>"]},{"id":"ad06-link","kind":"short","group":"idea","img":"img/ad06/christmas-light-projecto_10.jpg","alt":"Ảnh tham chiếu Pinterest: trần phòng ngập ánh đèn chiếu Giáng sinh","num":"15","name":"Quảng cáo 06 · Never made an ad? It's just a link.","stc":"wait","st":"Chờ anh duyệt storyboard bản 3 gọn (04/11)","tags":["Quảng cáo chạy chuyển đổi","Giáng sinh","28 giây","16:9","Từng bước trên web app","Dán link → video UGC"],"why":["Brief marketing (sheet, video 6): người xem không biết gì hết, đi từng bước trên web app, Just a link.","Sản phẩm đèn chiếu Giáng sinh đang rất nóng: một shop chạy khoảng 420 mẫu quảng cáo trên Meta Ad Library (đo 03/11/2026)."],"dl":[["Sản phẩm","Đèn chiếu Giáng sinh trong nhà, shop giả Snowglow, không logo"],["Câu mở","<span class=\"en\">\"Never made an ad? It's just a link.\"<\/span>"],["Cảnh","Tờ brief/form dài bị gạch · 3 bước trên web app Promer thật (Copy · Paste · Generate) · ra video UGC · No prompts/models/filming · Spy/Clone · doanh thu · CTA"],["Hai bản","Một bản gọn, web app sạch"],["Cần chốt","Duyệt bản gọn"]],"btns":[{"href":"storyboard-ad06-just-a-link_Claude.html","text":"Xem storyboard","main":true}],"sum":"(16:9, 28 giây) Cho người chưa từng làm quảng cáo: đi từng bước trên web app Promer, chỉ cần dán link trang sản phẩm là ra video UGC đèn chiếu."},{"id":"l01s1","kind":"short","group":"channel","img":"img/l01-shorts/tuong_sheet.jpg","alt":"UGC · Chọn creator giống người mua","num":"L1","name":"UGC · Chọn creator giống người mua","stc":"wait","st":"Content chờ duyệt · cắt ý từ video dài L01","tags":["UGC Ads","Máy sấy tóc (cùng sản phẩm L01)","20–30 s"],"sum":"Một tiêu chí chọn người trong quảng cáo UGC: giống người MUA, không phải người đẹp nhất; và test 2 gương mặt cùng một kịch bản.","why":["Video dài L01 là trục; Short này dẫn người xem sang L01 (UGC Ads)","Tuần 01–07/11: video đi theo search giữ khách 48–57%, video feed bị lướt 89–95% ⇒ hook 2 giây phải thấy thành phẩm"],"dl":[["Tiêu đề","<span class='en'>Cast the Creator Who Looks Like Your Buyer | AI UGC Ads<\/span>"],["Hook ≤ 2 s","Chữ to: <b>PICK YOUR FACE.<\/b><br><span class='en'>\"Hundreds of creators. One hair dryer. Who sells it best?\"<\/span>"],["CTA","<span class='en'>Which face would you cast for your product? Tell me in one word.<\/span>"],["Dẫn sang","Related video: L01 (video dài 3 tính năng, sắp đăng)"]],"btns":[],"more":["<h3>Content · UGC · Chọn creator giống người mua (chờ duyệt)<\/h3><p><b>Người xem dừng vì:<\/b> Giây 0: bức tường hàng trăm creator cùng cầm một máy sấy, chữ to PICK YOUR FACE.<br><b>Mang về:<\/b> Một tiêu chí chọn người trong quảng cáo UGC: giống người MUA, không phải người đẹp nhất; và test 2 gương mặt cùng một kịch bản.<br><b>Xem xong làm:<\/b> Thử 2 avatar cùng một kịch bản thay vì viết lại kịch bản.<\/p><p><b>Lời Emma (~25 s):<\/b><\/p><ol class='en'><li>Hundreds of creators. One hair dryer. Who sells it best?<\/li><li>Not the prettiest one. The one who looks like the person who actually buys.<\/li><li>Thick hair, always late in the morning? Cast her.<\/li><li>In Promer UGC Ads you pick from thousands of avatars, filtered by region, age and style.<\/li><li>Same script, two faces. Let the numbers pick the winner.<\/li><\/ol><p><b>Cảnh (hình lấy từ kho L01, sẽ đổi sang khung thật khi dựng):<\/b><\/p><table style='width:100%;border-collapse:collapse'><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>0–2 s<\/td><td style='vertical-align:top;padding:6px'>Bức tường hàng trăm ô creator cầm máy sấy, máy lùi nhanh; chữ PICK YOUR FACE.<br><img src=\"img/l01-shorts/tuong_sheet.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>2–7 s<\/td><td style='vertical-align:top;padding:6px'>Hai ô sáng lên: người mẫu studio (xám đi) và cô gái tóc dày trong phòng tắm (sáng lên).<br><img src=\"img/l01-shorts/cr_studio.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><img src=\"img/l01-shorts/cr_bath.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>7–13 s<\/td><td style='vertical-align:top;padding:6px'>Cận cô gái: buổi sáng vội, tóc dày; chữ &quot;looks like your buyer&quot;.<br><img src=\"img/l01-shorts/cr_bath2.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>13–20 s<\/td><td style='vertical-align:top;padding:6px'>UI Select avatar (chụp app thật), lọc region / age / style.<br><img src=\"img/l01-shorts/ui_ugc.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>20–26 s<\/td><td style='vertical-align:top;padding:6px'>Màn chia đôi 2 avatar cùng câu thoại, thanh số liệu chạy lên ở một bên.<br><img src=\"img/l01-shorts/cr_desk.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><img src=\"img/l01-shorts/cr_bath.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><\/table><p style='color:#595969;font-size:13px'>Đối chiếu 27 video công khai (09/11): không dùng khuôn \"Turn (1) Photo Into…\", \"Stop…\", \"How Top…\", \"Secret to…\"; không kết bằng lưới 3 bản + \"Comment 1 reat. Is it actually winning?\"<\/span>"],["CTA","<span class='en'>Full clone walkthrough with this exact ad in the related video.<\/span>"],["Dẫn sang","Related video: L01 (video dài 3 tính năng, sắp đăng)"]],"btns":[],"more":["<h3>Content · Clone · 3 dấu hiệu quảng cáo đang thắng (chờ duyệt)<\/h3><p><b>Người xem dừng vì:<\/b> Giây 0: quảng cáo máy sấy đẹp (macro luồng gió) với dấu hỏi to.<br><b>Mang về:<\/b> 3 tiêu chí kiểm quảng cáo thắng trước khi clone: chạy nhiều tháng, nhiều phiên bản, hook lặp lại.<br><b>Xem xong làm:<\/b> Mở thư viện quảng cáo, kiểm 3 dấu hiệu trước khi chọn mẫu.<\/p><p><b>Lời Emma (~25 s):<\/b><\/p><ol class='en'><li>This ad looks great. Is it actually winning?<\/li><li>Three signs. It&#x27;s been running for months. Brands don&#x27;t pay for ads that don&#x27;t work.<\/li><li>The brand made several versions of it.<\/li><li>And the same hook keeps coming back.<\/li><li>Three out of three? Clone the structure, not the product.<\/li><\/ol><p><b>Cảnh (hình lấy từ kho L01, sẽ đổi sang khung thật khi dựng):<\/b><\/p><table style='width:100%;border-collapse:collapse'><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>0–2 s<\/td><td style='vertical-align:top;padding:6px'>Quảng cáo mẫu macro luồng gió, chữ IS IT REALLY WINNING?<br><img src=\"img/l01-shorts/ref_hook.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>2–9 s<\/td><td style='vertical-align:top;padding:6px'>Dấu 1: nhãn &quot;Running for months&quot; đập vào.<br><img src=\"img/l01-shorts/ref_texture.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>9–14 s<\/td><td style='vertical-align:top;padding:6px'>Dấu 2: 3 phiên bản xếp chồng trượt ra.<br><img src=\"img/l01-shorts/ref_hand.jpg\" s detail.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>9–15 s<\/td><td style='vertical-align:top;padding:6px'>Mũi tên hướng sáng trên quảng cáo mẫu.<br><img src=\"img/l01-shorts/ref_texture.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>15–21 s<\/td><td style='vertical-align:top;padding:6px'>Bản clone sửa, sáng cùng phía.<br><img src=\"img/l01-shorts/cl_texture.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><tr><td style='white-space:nowrap;vertical-align:top;padding:6px'>21–26 s<\/td><td style='vertical-align:top;padding:6px'>Hai bản chạy song song, cùng nhịp cắt.<br><img src=\"img/l01-shorts/ref_result.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><img src=\"img/l01-shorts/cl_result.jpg\" style=\"width:92px;height:128px;object-fit:cover;border-radius:8px;margin:0 4px 4px 0;border:1px solid #dee1f3\"><\/td><\/tr><\/table><p style='color:#595969;font-size:13px'>Đối chiếu 27 video công khai (09/11): không dùng khuôn \"Turn (1) Photo Into…\", \"Stop…\", \"How Top…\", \"Secret to…\"; không kết bằng lưới 3 bản + \"Comment 1, 2 or 3\"; mỗi video một lời hứa, một CTA riêng; không mở bằng câu gọi người bán Shopify.<\/p>"]},{"id":"l01s7","kind":"short","group":"channel","img":"img/l01-shorts/a_grey.jpg","alt":"Animation · Ý tưởng hơn xoay chậm","num":"L7","name":"Animation · Ý tưởng hơn xoay chậm","stc":"wait","st":"Content chờ duyệt · cắt ý từ video dài L01","tags":["Ad Animation","Máy sấy tóc (cùng sản phẩm L01)","20–30 s"],"sum":"Công thức viết ý tưởng chuyển động: camera làm gì, sản phẩm làm gì, ánh sáng làm gì; 2 ví dụ (v function ideasBox() {

  return `<details class="more" style="margin:0 0 18px;padding:16px 18px"><summary style="cursor:pointer;font-weight:700">Kho ${IDEAS.length} ý tưởng video cho dạng mới (bấm để mở)</summary>`

}
function planBox(nf) {
  const a = nf.slice().sort((x, y) => x.ord - y.ord);
  const dot = {1:'Đợt 1 · làm trước (có video phải kịp Black Friday 27/11)', 2:'Đợt 2 · chỉ cần ảnh AI và bộ màn Promer đã dựng', 3:'Đợt 3', 4:'Đợt 4 · nhiều ảnh nhất hoặc cần kiểm chứng'};
  let cur = 0, rows = '';
  for (const v of a) { if (v.dot !== cur) { cur = v.dot; rows += `<tr><td colspan="6" style="background:var(--bg-2);font-weight:700">${dot[cur]}</td></tr>`; }
    rows += `<tr><td>${v.ord}</td><td><a href="#v-${esc(v.id)}"><b>Shorts ${esc(v.num)}</b></a><br>${esc(v.name)}</td><td style="white-space:nowrap">${esc(v.chu)}</td><td>${esc(v.sp)}</td><td>${esc(v.kieu)}</td><td><span class="pill ${esc(v.stc)}">${esc(v.st)}</span></td></tr>`; }
  return `<section class="more" style="margin:0 0 18px"><h3 style="margin-top:0">Kế hoạch triển khai ${a.length} Shorts dạng mới</h3>`
    + `<p>Xếp theo thứ tự làm, không hẹn ngày. Mỗi video một sản phẩm riêng và một kiểu showcase riêng, không video nào giống video nào. Bấm vào số Shorts để xem nội dung.</p>`

    + `<p><b>Mỗi video đi qua 6 bước:</b> 1. Content (thẻ video trên trang này) · 2. Storyboard từng cảnh · 3. Tạo ảnh và video AI của sản phẩm · 4. Dựng trong After Effects · 5. Nhạc và tiếng động · 6. Duyệt, xuất, đăng.</p>`
    + `<p><b>Dùng chung cho cả ${a.length} video</b> (đã dựng xong ở Shorts 16): nền xám Promer, thẻ đăng ký Create your account, màn một cú bấm Generate, con trỏ, màn cuối logo + promer.ai.</p>`

}

  const th = v.img
    ? `<div class="th" style="background-image:url('${esc(v.img)}')"><span class="num">${esc(v.num)}</span></div>`
    : `<div class="th empty"><span class="num">${esc(v.num)}</span>${esc(v.alt || v.name)}</div>`;
  return `<a class="vcard" href="#v-${esc(v.id)}">${th}<div class="bd"><div class="nm">${esc(v.name)}</div>`
    + `<span class="pill ${esc(v.stc)}">${esc(v.st)}</span><div class="sm">${esc(v.sum)}</div></div></a>`;
}

function home() {
  const pics = shorts.filter(v => v.img).slice(0, 3).map(v => `<img src="${esc(v.img)}" alt="">`).join('');
  return `<h1>Plan video Promer AI</h1>
  <p class="sub">Chọn loại video để xem danh sách. Bấm vào từng video để xem nội dung, rồi bấm "Xem storyboard" để xem cách làm.</p>
  <div class="tiles">
    <a class="tile" href="#shorts"><div class="art">${pics}</div><div class="txt"><b>Shorts</b><span>Video dọc 20 đến 30 giây</span><span class="count">${shorts.length} video</span></div></a>
    <a class="tile long" href="#long"><div class="art"><img class="wide" src="img/ads-evox/ui_result.jpg" alt="Màn hình app Promer đang tạo 3 video quảng cáo"></div><div class="txt"><b>Video dài</b><span>Video ngang, từ 8 phút 30 giây</span><span class="count">${longs.length} video</span></div></a>
  </div>${sched()}${foot}`;
}

function sched() {
  const ps = V.filter(v => v.post).sort((a, b) => b.post.day.localeCompare(a.post.day));
  if (!ps.length) return '';
  const rows = ps.map(v => `<a class="srow" href="#v-${esc(v.id)}"><span class="sday"><b>${esc(v.post.date)}</b>${esc(v.post.time)}</span>`
    + `<img src="${esc(v.img)}" alt="" loading="lazy"><span class="sinfo"><b>Shorts ${esc(v.num)} · ${esc(v.name)}</b><span>Sản phẩm: ${esc(v.post.product)}</span></span>`
    + `<span class="pill done">Đã đăng</span></a>`).join('');
  return `<section class="sched"><h2>Lịch đăng</h2><p class="sub">Video đã xong và đã lên kênh YouTube Promer AI. Giờ Việt Nam, mới nhất ở trên.</p><div class="slist">${rows}</div></section>`;
}

function list(kind) {
  if (kind === 'short') {
    const ch = shorts.filter(v => v.group === 'channel').map((v, i) => [v, i]).sort((a, b) => (b[0].post ? 1 : 0) - (a[0].post ? 1 : 0) || (a[0].post && b[0].post ? b[0].post.day.localeCompare(a[0].post.day) : 0) || a[1] - b[1]).map(x => x[0]), id = shorts.filter(v => v.group === 'idea');
    const nf = shorts.filter(v => v.group === 'sfc').sort((x, y) => x.ord - y.ord);
    return `<a class="back" href="#">← Trang đầu</a><h2>Shorts</h2>
    <p class="sub">Video dọc 20 đến 30 giây. Bấm vào video để xem nội dung.</p>
    ${nf.length ? `<div class="group" id="dang-moi"><h3>Dạng mới: Đơn giản · Nhanh · Rẻ</h3><p>Cách làm Shorts từ 10/11: hook 2 giây (10–15%) · showcase thành phẩm 40–50% · một thao tác trên Promer khoảng 10% · kết bằng màn đăng ký Promer. Tối đa 30 giây, không giọng đọc.</p>${planBox(nf)}${ideasBox()}<div class="grid">${nf.map(card).join('')}</div></div>` : ''}
    <div class="group"><h3>Shorts của kênh</h3><p>${ch.length} video</p><div class="grid">${ch.map(card).join('')}</div></div>
    ${id.length ? `<div class="group" id="y-tuong"><h3>Ý tưởng quảng cáo mới</h3><p>Quảng cáo extension Promer trên Chrome, ý tưởng riêng.</p><div class="grid">${id.map(card).join('')}</div></div>` : ''}${foot}`;
  }
  return `<a class="back" href="#">← Trang đầu</a><h2>Video dài</h2>
  <p class="sub">Video ngang từ 8 phút 30 giây. Bấm vào video để xem nội dung.</p>
  <div class="group"><div class="grid long">${longs.map(card).join('')}</div></div>${foot}`;
}

function detail(v) {
  const backHref = v.kind === 'short' ? '#shorts' : '#long';
  const big = v.img ? `<div class="big" style="background-image:url('${esc(v.img)}')" role="img" aria-label="${esc(v.alt)}"></div>` : `<div class="big empty">${esc(v.alt || v.name)}</div>`;
  const sb = v.btns.find(b => b.href && /storyboard/i.test(b.href)) || v.btns.find(b => b.href && b.main && !/youtube/.test(b.href));
  const off = v.btns.find(b => !b.href);
  const p = v.post;
  const main = (p ? `<a class="btn" href="${esc(p.yt)}" target="_blank" rel="noopener">Xem trên YouTube →</a> ` : '')
    + (sb ? `<a class="btn${p ? ' ghost' : ''}" href="${esc(sb.href)}">Xem storyboard${p ? '' : ' →'}</a>` : (p ? '' : `<span class="btn off">${esc(off ? off.text : 'Storyboard: chưa làm')}</span>`));
  const others = v.btns.filter(b => b.href && b !== sb && !(p && /youtube/.test(b.href))).map(b => `<a href="${esc(b.href)}">${esc(b.text)}</a>`).join('');
  const postRows = p ? [['Lịch đăng', `<b>${esc(p.time)} ngày ${esc(p.date)}</b> giờ Việt Nam (${esc(p.ny)})`], ['Sản phẩm', `<b>${esc(p.product)}</b>`], ['Tiêu đề trên YouTube', `<span class="en">${esc(p.title)}</span>`]] : [];
  const rows = postRows.concat(v.dl).map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('');
  const why = v.why.length ? `<div class="why"><h4>Vì sao chọn video này</h4><ul>${v.why.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
  return `<a class="back" href="${backHref}">← ${v.kind === 'short' ? 'Danh sách Shorts' : 'Danh sách video dài'}</a>
  <div class="detail ${v.kind === 'long' ? 'long' : ''}">${big}<div class="info">
    <div><div style="color:var(--ink-3);font-weight:700;font-size:13px">${v.kind === 'short' ? 'SHORTS' : 'VIDEO DÀI'} ${esc(v.num)}</div><h2>${esc(v.name)}</h2></div>
    <span class="pill ${esc(v.stc)}">${esc(v.st)}</span>
    <p class="lead">${esc(v.sum)}</p>
    <div>${main}</div>
    ${why}
    <dl>${rows}</dl>
    ${others ? `<div class="minor">${others}</div>` : ''}
  </div></div>${(v.more || []).map(m => `<section class="more">${m}</section>`).join('')}${foot}`;
}

function render() {
  const h = location.hash.replace('#', '');
  const app = document.getElementById('app');
  let out;
  if (h === 'shorts' || h === 'quang-cao' || h === 'y-tuong') out = list('short');
  else if (h === 'long' || h === 'video-dai') out = list('long');
  else if (h.startsWith('v-')) { const v = V.find(x => x.id === h.slice(2)); out = v ? detail(v) : home(); }
  else out = home();
  app.innerHTML = out;
  if (h === 'quang-cao' || h === 'y-tuong') document.getElementById('y-tuong')?.scrollIntoView();
  else window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
